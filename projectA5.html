<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project 5 | Ar. Kavitha portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>

        body{
            font-family:Poppins,sans-serif;
            background:#f8f8f8;
            margin:0;
        }

        .project-container{
            max-width:1100px;
            margin:120px auto 60px;
            padding:20px;
        }

        h1{
            text-align:center;
            font-family:'Playfair Display',serif;
            font-size:42px;
            margin-bottom:10px;
        }

        .project-slider{
            width:100%;
            height:700px;
            position:relative;
            overflow:hidden;
            border-radius:12px;
            margin:40px 0;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        .project-slide{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#f5f5f5;
    opacity:0;
    transition:opacity .8s ease;
}

        .project-slide.active{
            opacity:1;
        }

        .content{
            display:grid;
            grid-template-columns:2fr 1fr;
            gap:40px;
        }

        .description,
        .details{
            background:#fff;
            padding:30px;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,.08);
        }

        .description h2,
        .details h2{
            margin-top:0;
            color:#b48b3f;
        }

        .details table{
            width:100%;
            border-collapse:collapse;
        }

        .details td{
            padding:12px 0;
            border-bottom:1px solid #ddd;
        }

        .details td:first-child{
            font-weight:600;
            width:40%;
        }

        .back-btn{
            display:inline-block;
            margin-top:40px;
            background:#b48b3f;
            color:#fff;
            padding:12px 30px;
            text-decoration:none;
            border-radius:6px;
        }

        .back-btn:hover{
            background:#96712d;
        }

        @media(max-width:768px){

            .content{
                grid-template-columns:1fr;
            }



            h1{
                font-size:32px;
            }

        }

    </style>

</head>

<body>

<div class="project-container">

    <h1>Project 5</h1>

    <div class="project-slider">

        <img src="projects/project5.png" class="project-slide active">

    

        
    </div>

    <div class="content">

        <div class="description">

            <h2>Project Description</h2>

            <p>
                This project is an architectural project focused on sustainability, functionality and premium finishes.
            </p>

        </div>

        <div class="details">

            <h2>Project Details</h2>

            <table>

                <tr>
                    <td>Client Name</td>
                    <td>Private client</td>
                </tr>

                <tr>
                    <td>Location</td>
                    <td>Hyderabad, Telangana</td>
                </tr>

                <tr>
                    <td>Category</td>
                    <td>Residential Architecture</td>
                </tr>

                <tr>
                    <td>Project Type</td>
                    <td>Independent House</td>
                </tr>

            </table>

        </div>

    </div>

    <a href="architecture.html" class="back-btn">← Back to Projects</a>

</div>

<script>

const slides = document.querySelectorAll(".project-slide");

let current = 0;

setInterval(() => {

    slides[current].classList.remove("active");

    current = (current + 1) % slides.length;

    slides[current].classList.add("active");

}, 3000);

</script>

</body>
</html>
